name: Deploy to EC2

on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 세팅
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 실행 권한 부여
        run: chmod +x ./gradlew

      - name: Gradle 빌드
        run: ./gradlew bootJar -x test

      - name: Docker Hub 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker 이미지 빌드 & 푸시
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/owners-eye:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/owners-eye:latest

      - name: EC2 배포
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker start redis-stack 2>/dev/null || docker run -d \
              --name redis-stack \
              --network host \
              redis/redis-stack-server:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/owners-eye:latest
            docker stop owners-eye || true
            docker rm owners-eye || true
            docker run -d \
              --name owners-eye \
              --network host \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e "DB_URL=${{ secrets.DB_URL }}" \
              -e "DB_USERNAME=${{ secrets.DB_USERNAME }}" \
              -e "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
              -e "REDIS_HOST=localhost" \
              -e "REDIS_PORT=6379" \
              -e "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" \
              -e "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
              -e "JWT_ACCESS_EXPIRATION=${{ secrets.JWT_ACCESS_EXPIRATION }}" \
              -e "JWT_REFRESH_EXPIRATION=${{ secrets.JWT_REFRESH_EXPIRATION }}" \
              ${{ secrets.DOCKER_USERNAME }}/owners-eye:latest
